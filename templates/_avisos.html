{# Mensajes flash de Flask (errores de login, documentos subidos, etc.) #}
{% with mensajes = get_flashed_messages(with_categories=true) %}
  {% if mensajes %}
    <div class="avisos-flash" role="status">
      {% for categoria, mensaje in mensajes %}
        <div class="aviso-flash aviso-{{ categoria if categoria != 'message' else 'info' }}">
          <span>{{ mensaje }}</span>
          <button type="button" aria-label="Cerrar" onclick="this.parentElement.remove()">×</button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
