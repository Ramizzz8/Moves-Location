<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block descripcion %}MovesLocation: gestiona tu proceso migratorio con asesores expertos, seguimiento en tiempo real y tus documentos en un solo lugar.{% endblock %}">
  <meta name="theme-color" content="#0b1b33">
  <title>{% block titulo %}MovesLocation{% endblock %} · MovesLocation</title>
  <link rel="icon" href="/static/images/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/moves.css">
  <script>
    // Aplica el tema guardado antes de pintar la página (evita el parpadeo)
    try {
      const tema = localStorage.getItem('moves-tema');
      if (tema === 'oscuro' || (!tema && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.dataset.tema = 'oscuro';
      }
    } catch (e) {}
  </script>
</head>
<body class="{% block clase_body %}{% endblock %}">
  {% include '_avisos.html' %}
  {% block cuerpo %}{% endblock %}
  <script src="/static/js/moves.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
